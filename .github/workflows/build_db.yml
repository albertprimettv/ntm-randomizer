name: Build Custom Database

on:
  workflow_run:
    workflows: ["Build artifacts and push to release"]  # Must match the exact 'name:' of your first workflow
    types:
      - completed

permissions:
  contents: write      # Required so GITHUB_TOKEN can push to another branch

jobs:
  build_db:
    # Only run if the upstream build succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout specific branch
        uses: actions/checkout@v4
        with:
          ref: release       # Replace with the branch name you want to check out

      - name: Build Custom Database for MiSTer Downloader
        run: set -o pipefail && curl --fail --location https://raw.githubusercontent.com/theypsilon/Downloader_DB-Template_MiSTer/main/.github/build_db.py | python3 -
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}