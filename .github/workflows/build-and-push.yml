name: Build artifacts and push to release

on:
  push:
    branches:
      - main
  workflow_dispatch:   # Allows you to run this manually from the Actions tab

permissions:
  contents: write      # Required so GITHUB_TOKEN can push to another branch

env:
  TARGET_BRANCH: release
  BUILD_TARGET: mister-export               # Target stage name in your Dockerfile

jobs:
  build-and-export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Dockerfile and export to local directory
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ env.BUILD_TARGET }}
          outputs: type=local,dest=./docker-output

      - name: Copy files into build output
        run: |
          mkdir -p ./build-output

          # README.md
          cp README.md ./build-output

          # Scripts directory
          mkdir -p ./build-output/Scripts/
          cp -r Scripts/* ./build-output/Scripts/

          # binaries
          mkdir -p ./build-output/ntm-randomizer
          cp ./docker-output/lithogen ./docker-output/turfmastrand ./build-output/ntm-randomizer/

      - name: Push exported files to target branch (single commit history)
        run: |
          # Move the exported files to a temporary directory outside the repo
          mv ./build-output /tmp/build-output

          # Configure Git identity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"

          # Create a fresh orphan branch with zero parent commits
          git checkout --orphan clean-export

          # Clear all tracked files and submodule directories from the working tree
          git rm -rf . || true
          git clean -fdx

          # Copy the combined Docker build output and source subfolder into the root
          cp -r /tmp/build-output/. .

          # Stage, commit, and force-push to replace the target branch history
          git add -A
          git commit -m "Update build output and source files from ${{ github.sha }}"
          git push --force origin clean-export:$TARGET_BRANCH